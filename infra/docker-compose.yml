services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: signalwake
      POSTGRES_USER: signalwake
      POSTGRES_PASSWORD: signalwake-local-only
    ports:
      - "5432:5432"
    volumes:
      - signalwake-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalwake -d signalwake"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  signalwake-postgres:

